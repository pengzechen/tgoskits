# Axvisor RT shell build for OrangePi-5-Plus (RK3588, 8 cores), booted from the
# microSD card slot, with two Lingkong RS485-protocol motors over plain TTL
# UART: left on UART3, right on UART6.
#
# Motor wiring on the 40-pin header (motor UART pins are TTL, full-duplex):
#   Left  motor: GPIO3_B5 / UART3 TX (pin 16) -> motor UART RX
#                GPIO3_B6 / UART3 RX (pin 18) <- motor UART TX
#   Right motor: GPIO1_A1 / UART6 TX (pin 8)  -> motor UART RX
#                GPIO1_A0 / UART6 RX (pin 10) <- motor UART TX
#   GND for both motors shared with the board.
#
# UART3 and UART6 use pin groups separate from I2C5 (GPIO1_B6/B7) and UART7
# (GPIO1_B4/B5), so this config can be combined with rt-i2c / rt-uart.
features = [
  "ax-driver/rockchip-dwmmc",
  "fs",
  "realtime",
  "rt-demo",
  "rt-selftest",
  "rt-motor",
]
log = "Info"
target = "aarch64-unknown-none-softfloat"
vm_configs = []

[env]
AX_RT_CPU = "7"
SMP = "8"
