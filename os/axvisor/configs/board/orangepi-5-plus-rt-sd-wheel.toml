# Axvisor RT wheel-control build for OrangePi-5-Plus (RK3588, 8 cores), booted
# from the microSD card slot. This config runs only the 8 ms wheel-control RT
# task; it does not enable the standalone MPU6050/UART/motor diagnostic tasks.
#
# Wiring on the 40-pin header matches the combined device test:
#   MPU6050 : GPIO1_B6 (SCL, pin 28), GPIO1_B7 (SDA, pin 27), GND, 3V3
#   Servo   : GPIO1_B5 / UART7 TX (pin 26) -> LU9685 UART RX, GND
#   Left  motor: GPIO3_B5 / UART3 TX (pin 16) -> motor UART RX,
#                GPIO3_B6 / UART3 RX (pin 18) <- motor UART TX
#   Right motor: GPIO1_A1 / UART6 TX (pin 8)  -> motor UART RX,
#                GPIO1_A0 / UART6 RX (pin 10) <- motor UART TX
features = [
  "ax-driver/rockchip-dwmmc",
  "fs",
  "realtime",
  "rt-wheel",
]
log = "Info"
target = "aarch64-unknown-none-softfloat"
vm_configs = []

[env]
AX_RT_CPU = "7"
SMP = "8"
