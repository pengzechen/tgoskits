# Axvisor RT shell build for OrangePi-5-Plus (RK3588, 8 cores), booted from the
# microSD card slot, with LU9685 servo control over UART7.
#
# UART wiring on the 40-pin header:
#   GPIO1_B5 / UART7 TX (header pin 26) -> LU9685 UART RX
#   GND                                 -> LU9685/servo-power GND
#
# UART7 uses GPIO1_B4/B5 (header pins 24/26), which are separate from the I2C5
# GPIO1_B6/B7 pins (header pins 27/28). Use orangepi-5-plus-rt-sd-i2c.toml for
# the I2C protocol variant.
features = [
  "ax-driver/rockchip-dwmmc",
  "fs",
  "realtime",
  "rt-demo",
  "rt-selftest",
  "rt-uart",
]
log = "Info"
target = "aarch64-unknown-none-softfloat"
vm_configs = []

[env]
AX_RT_CPU = "7"
SMP = "8"
