features = [
    "ax-driver/nvme",
    "fs",
    # Uses the ArceOS axtask realtime FIFO scheduler and sleepable mutex
    # priority inheritance path. This does not enable Axvisor's ax-rt executor.
    "sched-rt-fifo",
    # Capturing a backtrace is an expensive runtime operation.
    # Enable "backtrace" and [env] BACKTRACE = "y" below to
    # activate panic backtrace. Disabled by default for release.
    # "backtrace",
]
log = "Info"
max_cpu_num = 4
target = "aarch64-unknown-none-softfloat"
vm_configs = []

[env]
AX_RT_CPU = "3"
# BACKTRACE = "y"
