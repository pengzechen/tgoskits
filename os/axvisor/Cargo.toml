[package]
name = "axvisor"
authors = ["Keyang Hu <keyang.hu@qq.com>", "周睿 <zrufo747@outlook.com>"]
edition.workspace = true
version = "0.6.0"
description = "A lightweight type-1 hypervisor based on ArceOS"
repository = "https://github.com/arceos-hypervisor/axvisor"
homepage = "https://github.com/arceos-hypervisor/axvisor"
documentation = "https://docs.rs/axvisor"
readme = "README.md"
keywords = ["hypervisor", "virtualization", "arceos", "type-1"]
categories = ["os", "no-std", "embedded"]
license = "Apache-2.0"
include = [
    ".cargo/config.toml",
    "src/**",
    "build.rs",
    "configs/**",
    "xtask/src/**",
    "README.md",
    "LICENSE*",
]

[[bin]]
name = "axvisor"
path = "src/main.rs"
test = false

[[bin]]
name = "xtask"
path = "xtask/src/main.rs"
test = false
required-features = ["host-xtask"]

[[test]]
name = "axtest"
path = "tests/axtest.rs"
harness = false
required-features = ["axtest", "fs"]

[package.metadata.axtest]
runtime = "axvisor"

[package.metadata.docs.rs]
targets = ["aarch64-unknown-none-softfloat"]

[features]
default = []
host-xtask = []
axtest = []
fs = ["ax-std/ext4fs", "ax-std/fatfs", "axvm/host-fs"]
realtime = []
# Compiles the ax-rt RT primitive self-test suite into the RT task table and
# runs it from the host boot CPU. Off by default; enabled on the QEMU dev config
# to keep validating the RT primitives.
rt-selftest = ["ax-rt/selftest"]
# Adds an RT task on the reserved core that brings up RK3588 I2C5 (a 40-pin
# header bus, `disabled` in the DTB) and drives configured LU9685 I2C devices.
# Board-specific; off by default.
rt-i2c = ["dep:axklib", "dep:mmio-api"]
# Adds an RT task that probes and samples an MPU6050 on the same RK3588 I2C5
# header bus. Requires rt-i2c because that feature owns the I2C5 bring-up.
rt-mpu6050 = ["rt-i2c"]
# Adds an RT task that drives configured LU9685 UART devices through RK3588
# UART1. On OrangePi-5-Plus this uses the same GPIO1_B6/B7 header pins as I2C5,
# so do not enable it together with rt-i2c unless the board wiring is changed.
rt-uart = ["dep:axklib", "dep:mmio-api"]
sstc = ["axvm/sstc"]
stack-protector = ["ax-std/stack-protector"]
backtrace = ["ax-std/backtrace", "dep:axbacktrace"]
test-backtrace-panic = ["backtrace"]
test-panic-no-backtrace = ["dep:axbacktrace"]
test-console-interleave = ["dep:ax-log"]
test-console-atomic-output = ["ax-std/sched-rr"]
# axum-based management HTTP server (see src/http/ for the Router).
# Off by default. Replaces the hand-rolled pilot, which is intentionally not
# carried forward.
# axum-based management HTTP server. Pulls `ax-std/net` explicitly so the
# ArceOS network stack (which probes the QEMU virtio-net NIC and backs the
# tokio `TcpListener`) is enabled only when the control plane is built; a
# non-HTTP build must not enable the network subsystem.
http-axum = ["ax-std/net", "dep:axum", "dep:tokio", "dep:serde_json"]
# Do not auto-boot the default VMs at startup; the HTTP control plane starts
# and stops them on demand (VMs are created and stay in `Ready`).
no-auto-start = []

[dependencies]
shlex.workspace = true
axtest.workspace = true
heapless.workspace = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(axtest)', 'cfg(feature, values("ax-std"))'] }

[target.'cfg(any(not(any(windows, unix)), target_env = "musl"))'.dependencies]
anyhow.workspace = true
ax-log = { workspace = true, optional = true }
log = "0.4"
axum = { version = "0.8", optional = true }
serde_json = { version = "1", optional = true }
# The runtime only enables the IO driver (`enable_io()`), so no `time` driver
# and thus no `timerfd` syscall is needed. `rt` + `net` cover the manually
# built current-thread runtime and `TcpListener`.
tokio = { version = "1", optional = true, features = ["rt", "net"] }

# System dependent modules provided by ArceOS.
ax-api.workspace = true
ax-std = { workspace = true, default-features = false, features = [
  "alloc",
  "fd",
  "ext-ld",
  "paging",
  "irq",
  "multitask",
  "task-ext",
  "smp",
  "hv",
  "tls",
  "std-compat",
] }
# System dependent modules provided by ArceOS-Hypervisor (bare-metal only)
# ax-runtime = { version = "=0.3.0-preview.1", features = ["alloc", "irq", "paging", "smp", "multitask"] }
ax-rt.workspace = true
ax-realtime.workspace = true
axvm = { workspace = true, default-features = false, features = ["tls"] }
axvmconfig = { workspace = true, default-features = false }
axvm-types.workspace = true
axdevice.workspace = true
axdevice_base.workspace = true
axvirtio-common.workspace = true
axvirtio-net.workspace = true
toml.workspace = true
ax-memory-addr.workspace = true
ax-driver = { workspace = true, optional = true }
axbacktrace = { workspace = true, optional = true }
axklib = { workspace = true, optional = true }
mmio-api = { workspace = true, optional = true }

[dev-dependencies]
axtest = { path = "../../components/axtest/axtest" }
ax-hal = { path = "../arceos/modules/axhal" }

# xtask dependencies (only used on host platforms)
[target.'cfg(any(windows, all(unix, not(target_env = "musl"))))'.dependencies]
anyhow.workspace = true
axbuild = { workspace = true }
clap = { version = "4.6", features = ["derive"] }
tokio = { version = "1", features = ["full"] }

[build-dependencies]
anyhow = { workspace = true, features = ["std"] }
prettyplease = { workspace = true }
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn = { workspace = true }
toml = { workspace = true, features = ["std", "serde", "parse", "display"] }
